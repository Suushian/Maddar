name: madaar
description: "مدار — سیستم عامل شخصی مدیریت زندگی روزمره (RTL، شمسی، Local-first)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2

  go_router: ^14.2.0
  shamsi_date: ^2.0.0
  intl: ^0.19.0

  lucide_icons_flutter: ^3.0.0
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0

  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.3.0
  file_picker: ^8.0.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/vazirmatn/OFL.txt

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn/Vazirmatn-ExtraBold.ttf
          weight: 800
