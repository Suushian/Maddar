name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag for the debug APK'
        required: true
        default: 'debug-latest'

permissions:
  contents: write

concurrency:
  group: madaar-debug-apk
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build unsigned debug APK and publish to Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Flutter version from .fvmrc
        id: flutter_version
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-debug-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK and compute SHA-256
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk madaar-debug.apk
          sha256sum madaar-debug.apk > madaar-debug.sha256
          ls -lh madaar-debug.apk madaar-debug.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madaar-debug-apk
          path: |
            madaar-debug.apk
            madaar-debug.sha256
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-debug-latest}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" madaar-debug.apk madaar-debug.sha256 --clobber
          else
            gh release create "$tag" madaar-debug.apk madaar-debug.sha256 \
              --prerelease \
              --title "مدار — نسخه دیباگ" \
              --notes "APK دیباگ و امضانشده مدار برای دانلود و آزمون. فاقد بهینهسازی release است."
          fi
          gh release view "$tag" --json url --jq .url
